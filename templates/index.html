
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Protein Sequence Submission</title>
  <style>
    /* Ensure the whole viewport is used */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #1E2030;
      overflow: hidden;
    }
    /* Background image container with rotation animation */
    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url("{{ url_for('static', filename='img/4v60_color_hres.png') }}") no-repeat center center;
      background-size: cover;
      background-color: transparent;
      z-index: 0;
      animation: spin 60s linear infinite;
    }
    /* Keyframes for a full 360° rotation */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    /* Container for content; set text color and centering */
    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #fff;
      text-shadow: 1px 1px 2px black;
    }
    /* Styling for the textarea */
    textarea {
      width: 300px;
      height: 150px;
      font-size: 16px;
      margin-bottom: 10px;
      resize: none;
    }
    /* Button styling */
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    /* Queue/status message styling */
    .queue {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="background"></div>
  <div class="container">
    <h1>Submit your Protein Sequence</h1>
    <form id="sequenceForm">
      <textarea id="proteinSequence" placeholder="Enter your protein sequence here"></textarea>
      <br>
      <button type="submit">Submit</button>
    </form>
    <div id="queueStatus" class="queue" style="display:none;">
      Your sequence is being processed...
    </div>
  </div>
  
  <script>
    // Capture the form submission event
    document.getElementById('sequenceForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Show the queue status message
      document.getElementById('queueStatus').style.display = 'block';
      
      // Optionally, disable form fields to prevent further input
      document.getElementById('proteinSequence').disabled = true;
      this.querySelector('button').disabled = true;
      
      // Simulate backend processing delay (3 seconds here)
      setTimeout(function() {
        // Redirect to the results page
        window.location.href = "results.html";
      }, 3000);
    });
  </script>
</body>
</html>
